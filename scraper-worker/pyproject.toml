[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-worker"
version = "0.1.0"
description = "JavScraper Python Worker - JSON-RPC IPC for video metadata scraping"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
